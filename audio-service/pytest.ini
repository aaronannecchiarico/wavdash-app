[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests for individual components
    feature: Feature tests for end-to-end functionality
    integration: Integration tests requiring external services
    slow: Tests that take longer to run
    gpu: Tests that require GPU acceleration
    r2: Tests specifically for R2 storage functionality
    r2_integration: Integration tests for R2 storage workflows
filterwarnings =
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestReturnNotNoneWarning
    # Suppress specific audioread/librosa warnings in Python 3.13
    ignore:aifc was removed in Python 3.13.*:DeprecationWarning:audioread.rawread
    ignore:sunau was removed in Python 3.13.*:DeprecationWarning:audioread.rawread
    ignore:.*PySoundFile failed.*:UserWarning
    ignore:.*__audioread_load.*:FutureWarning
    ignore:.*n_fft=.*is too large.*:UserWarning
    # Catch any other DeprecationWarnings we want to ignore
    ignore::DeprecationWarning