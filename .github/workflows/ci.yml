name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Laravel App
  # ============================================================================
  laravel-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Build SSR
        run: npm run build:ssr

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Tests
        run: composer run test

  laravel-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm install

      - name: Run Pint
        run: vendor/bin/pint

      - name: Run PHPStan
        run: composer run analyse

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

  # ============================================================================
  # Audio Service
  # ============================================================================
  audio-service-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: audio-service/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Run Unit Tests
        run: pytest tests/unit/ -v --cov=. --cov-report=xml

  audio-service-feature-tests:
    runs-on: ubuntu-latest
    needs: audio-service-unit-tests
    defaults:
      run:
        working-directory: audio-service
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: audio-service/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 redis-tools

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Wait for Redis
        run: |
          timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping; do
            echo "Waiting for Redis..."
            sleep 2
          done'
          echo "Redis is ready!"

      - name: Create Test Audio File
        run: |
          python -c "
          import numpy as np, soundfile as sf
          from pathlib import Path
          sr = 22050
          t = np.linspace(0, 1.0, sr)
          audio = 0.5 * np.sin(2 * np.pi * 440.0 * t)
          Path('tests/fixtures').mkdir(parents=True, exist_ok=True)
          sf.write('tests/fixtures/test_audio.wav', audio, sr)
          print('Test audio file created')
          "

      - name: Run Feature Tests
        run: |
          pytest tests/feature/test_setup.py -v --tb=short
          pytest tests/feature/test_feature_service.py -v --tb=short

  audio-service-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: audio-service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Formatting (Black)
        run: black --check --diff .

      - name: Check Import Sorting (isort)
        run: isort --check-only --diff .

      - name: Lint (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --statistics

  # ============================================================================
  # Marketing Site
  # ============================================================================
  marketing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Site
        run: npm run build

      - name: Check TypeScript
        run: npm run check
